<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HaoNav</title>
    <script>
      // 初始配置 - 与 App.tsx 中的 INITIAL_SITE_CONFIG 保持一致
      const INITIAL_SITE_CONFIG = {
        title: 'HaoNav',
        favicon: ''
      };

      // 快速应用标题和图标（优先 localStorage，其次初始配置）
      (function() {
        try {
          const stored = localStorage.getItem('cloudnav_data_cache');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.settings) {
              // 使用云端缓存的设置
              if (parsed.settings.title) {
                document.title = parsed.settings.title;
              }
              if (parsed.settings.favicon) {
                const link = document.querySelector("link[rel~='icon']");
                if (link) {
                  link.href = parsed.settings.favicon;
                }
              }
              return;
            }
          }
        } catch (e) {}

        // localStorage 没有数据，使用初始配置
        if (INITIAL_SITE_CONFIG.title) {
          document.title = INITIAL_SITE_CONFIG.title;
        }
        if (INITIAL_SITE_CONFIG.favicon) {
          const link = document.querySelector("link[rel~='icon']");
          if (link) {
            link.href = INITIAL_SITE_CONFIG.favicon;
          }
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6',
              secondary: '#64748b',
              dark: '#0f172a',
              card: '#1e293b',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Custom scrollbar for sidebar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Simple CSS-only tooltip transition */
      .tooltip-custom {
          transition: opacity 0.2s, visibility 0.2s;
          pointer-events: none;
      }
      /* Slide down animation for toast */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
    </style>
  <script type="importmap">

</head>
  <body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-300">
    <!-- 加载遮罩，防止标题和图标闪烁 -->
    <div id="loading-overlay" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    ">
      <div style="text-align: center;">
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid #e5e7eb;
          border-top-color: #3b82f6;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 16px;
        "></div>
        <div style="color: #6b7280; font-size: 14px;">加载中...</div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root" style="display: none;"></div>
