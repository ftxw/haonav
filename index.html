<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="%SITE_ACCENT%" />
    <title>%SITE_NAME%</title>
    <link rel="icon" href="%SITE_ICON%" />
    <script>
      /* 二次访问零闪烁：首帧前用 localStorage 缓存覆盖 title / favicon / --accent / 暗色 */
      (function () {
        try {
          var m = document.querySelector('meta[name="theme-color"]');
          var accent = m ? m.content : '#3b82f6';
          var name = document.title;
          var raw = localStorage.getItem('haonav.v1.doc');
          var entry = raw ? JSON.parse(raw) : null;
          var doc = entry && entry.doc ? entry.doc : entry;
          var s = (doc && doc.settings) || {};
          if (s.name) { name = s.name; document.title = s.name; }
          if (s.accent) accent = s.accent;
          document.documentElement.style.setProperty('--accent', accent);
          var ic = s.icon;
          var ch = String((ic && ic.value) || name).trim().charAt(0) || 'N';
          ch = ch.replace(/[<>&]/g, '');
          var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='" + accent + "'/><text x='32' y='33' font-family='system-ui,sans-serif' font-size='34' font-weight='600' fill='#fff' text-anchor='middle' dominant-baseline='central'>" + ch + '</text></svg>';
          var link = document.querySelector('link[rel="icon"]');
          if (link) link.href = ic && ic.type === 'image' && ic.value ? ic.value : 'data:image/svg+xml,' + encodeURIComponent(svg);
          var mode = localStorage.getItem('haonav.v1.theme') || s.themeDefault || 'system';
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* 缓存不可用时静默降级 */ }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div id="app">
      <!-- 骨架：HTML + CSS 直出，首帧即可见（有 localStorage 缓存时几乎看不到）。Vue 挂载时会被替换 -->
      <div class="app-shell" style="pointer-events: none" aria-hidden="true">
        <aside class="sidebar flex h-full flex-col border-r border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
          <div class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-100 px-5 dark:border-slate-700">
            <div class="h-8 w-8 rounded-lg bg-slate-200 dark:bg-slate-700"></div>
            <div class="h-4 w-24 rounded bg-slate-200 dark:bg-slate-700"></div>
          </div>
          <div class="space-y-2 p-3">
            <div class="h-9 rounded-xl bg-slate-100 dark:bg-slate-700/60"></div>
            <div class="h-9 rounded-xl bg-slate-100 dark:bg-slate-700/60"></div>
            <div class="h-9 rounded-xl bg-slate-100 dark:bg-slate-700/60"></div>
            <div class="h-9 rounded-xl bg-slate-100 dark:bg-slate-700/60"></div>
          </div>
        </aside>
        <div class="flex min-w-0 flex-col overflow-hidden">
          <div class="h-16 shrink-0 border-b border-slate-200 bg-white/80 dark:border-slate-700 dark:bg-slate-800/80"></div>
          <div class="flex-1 p-4 lg:p-8">
            <div class="grid grid-cols-2 gap-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8">
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
              <div class="h-16 rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
